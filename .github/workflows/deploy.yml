name: Deploy

on:
  push:
    branches: [claude/ecstatic-goldberg-3lu9lm]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/tuff-game
            git fetch origin claude/ecstatic-goldberg-3lu9lm
            git reset --hard origin/claude/ecstatic-goldberg-3lu9lm
            docker compose up --build -d
