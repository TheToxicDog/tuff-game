name: Deploy

on:
  push:
    branches: [claude/beautiful-goodall-yxw3gj]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy via SSM
        run: |
          set -e
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0cbdb215d5b8ab095 \
            --timeout-seconds 900 \
            --document-name AWS-RunShellScript \
            --parameters 'commands=[
              "set -e",
              "cd /opt/tuff-game",
              "sudo -u tuff env HOME=/opt/tuff-game git fetch origin claude/beautiful-goodall-yxw3gj",
              "sudo -u tuff env HOME=/opt/tuff-game git reset --hard origin/claude/beautiful-goodall-yxw3gj",
              "bash scripts/deploy-ec2.sh"
            ]' \
            --query 'Command.CommandId' --output text)

          echo "Command ID: $COMMAND_ID"
          for _ in $(seq 1 90); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-0cbdb215d5b8ab095 \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            echo "Status: $STATUS"
            case "$STATUS" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0cbdb215d5b8ab095 \
            --output text

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0cbdb215d5b8ab095 \
            --query 'Status' --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed with status: $STATUS"
            exit 1
          fi
